apiVersion: v1
kind: Secret
metadata: { name: minio-credentials }
type: Opaque
stringData:
  MINIO_ROOT_USER: minioadmin
  MINIO_ROOT_PASSWORD: minioadmin
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: minio }
spec:
  replicas: 1
  selector: { matchLabels: { app: minio } }
  template:
    metadata: { labels: { app: minio } }
    spec:
      securityContext: { fsGroup: 1000 }
      containers:
      - name: minio
        image: quay.io/minio/minio:latest
        args: ["server","/data","--console-address",":9001"]
        envFrom:
        - secretRef: { name: minio-credentials }
        ports:
        - { containerPort: 9000, name: s3 }
        - { containerPort: 9001, name: console }
        volumeMounts:
        - { name: data, mountPath: /data }
        readinessProbe:
          httpGet: { path: /minio/health/ready, port: 9000 }
          initialDelaySeconds: 10
        livenessProbe:
          httpGet: { path: /minio/health/live, port: 9000 }
          initialDelaySeconds: 20
      volumes:
      - name: data
        persistentVolumeClaim: { claimName: minio-data }
---
apiVersion: v1
kind: Service
metadata: { name: minio }
spec:
  selector: { app: minio }
  ports:
  - { name: s3, port: 9000, targetPort: s3 }
  - { name: console, port: 9001, targetPort: console }
---
apiVersion: route.openshift.io/v1
kind: Route
metadata: { name: minio-s3 }
spec:
  to: { kind: Service, name: minio }
  port: { targetPort: s3 }
  tls: { termination: edge }
---
apiVersion: route.openshift.io/v1
kind: Route
metadata: { name: minio-console }
spec:
  to: { kind: Service, name: minio }
  port: { targetPort: console }
  tls: { termination: edge }
---
apiVersion: batch/v1
kind: Job
metadata: { name: minio-mc-setup }
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: mc
        image: quay.io/minio/mc:latest
        env:
        - name: MINIO_ROOT_USER
          valueFrom: { secretKeyRef: { name: minio-credentials, key: MINIO_ROOT_USER } }
        - name: MINIO_ROOT_PASSWORD
          valueFrom: { secretKeyRef: { name: minio-credentials, key: MINIO_ROOT_PASSWORD } }
        - name: MINIO_BUCKET
          value: models
        command: ["/bin/sh","-lc"]
        args:
        - |
          mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
          mc mb -p "local/models" || true
          mc anonymous set download "local/models" || true
          echo "MinIO bucket ready: models"
