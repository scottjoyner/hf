apiVersion: apps/v1
kind: Deployment
metadata: { name: minio }
spec:
  replicas: 1
  selector: { matchLabels: { app: minio } }
  template:
    metadata: { labels: { app: minio } }
    spec:
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
      - name: minio
        image: quay.io/minio/minio:latest
        imagePullPolicy: IfNotPresent
        args: ["server","/data","--console-address",":9001"]
        envFrom: [ { secretRef: { name: minio-credentials } } ]
        ports:
        - { containerPort: 9000, name: s3 }
        - { containerPort: 9001, name: console }
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          readOnlyRootFilesystem: false
          capabilities: { drop: ["ALL"] }
        resources:
          requests: { cpu: 100m, memory: 256Mi }
          limits:   { cpu: 500m, memory: 512Mi }
        volumeMounts:
        - { name: data, mountPath: /data }
        readinessProbe:
          httpGet: { path: /minio/health/ready, port: 9000 }
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 6
        livenessProbe:
          httpGet: { path: /minio/health/live, port: 9000 }
          initialDelaySeconds: 20
          periodSeconds: 20
          failureThreshold: 6
      volumes:
      - name: data
        persistentVolumeClaim: { claimName: minio-data }
---
apiVersion: v1
kind: Service
metadata: { name: minio }
spec:
  selector: { app: minio }
  ports:
  - { name: s3, port: 9000, targetPort: s3 }
  - { name: console, port: 9001, targetPort: console }
---
apiVersion: route.openshift.io/v1
kind: Route
metadata: { name: minio-s3 }
spec:
  to: { kind: Service, name: minio }
  port: { targetPort: s3 }
  tls: { termination: edge }
---
apiVersion: route.openshift.io/v1
kind: Route
metadata: { name: minio-console }
spec:
  to: { kind: Service, name: minio }
  port: { targetPort: console }
  tls: { termination: edge }
---
apiVersion: batch/v1
kind: Job
metadata: { name: minio-mc-setup }
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      initContainers:
      - name: wait-minio
        image: quay.io/minio/mc:latest
        command: ["/bin/sh","-lc"]
        args:
        - |
          i=1
          while [ "$i" -le 60 ]; do
            if wget -qO- http://minio:9000/minio/health/ready >/dev/null 2>&1; then
              exit 0
            fi
            if (exec 3<>/dev/tcp/minio/9000) 2>/dev/null; then
              exec 3>&-
              exit 0
            fi
            echo "waiting for minio:9000 ($i/60)"; i=$((i+1)); sleep 3
          done
          echo "minio not ready"; exit 1
      containers:
      - name: mc
        image: quay.io/minio/mc:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: MINIO_ROOT_USER
          valueFrom: { secretKeyRef: { name: minio-credentials, key: MINIO_ROOT_USER } }
        - name: MINIO_ROOT_PASSWORD
          valueFrom: { secretKeyRef: { name: minio-credentials, key: MINIO_ROOT_PASSWORD } }
        - name: MINIO_BUCKET
          value: models
        - name: HOME
          value: /tmp
        - name: MC_CONFIG_DIR
          value: /tmp/mc
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          readOnlyRootFilesystem: false
          capabilities: { drop: ["ALL"] }
        resources:
          requests: { cpu: 25m, memory: 64Mi }
          limits:   { cpu: 200m, memory: 256Mi }
        command: ["/bin/sh","-lc"]
        args:
        - |
          set -euo pipefail
          mkdir -p "$MC_CONFIG_DIR"
          mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
          (mc ls "local/models" || mc mb -p "local/models")
          mc anonymous set download "local/models" || true
          echo "MinIO bucket ready: models"
